[default]
exclude = [
    "stellarlend-client",
]
exclude-files = [
    "client/**/*",
    "indexing_system/**/*",
    "contracts/amm/**/*",
    # hello-world is a retired duplicate that is no longer a workspace member.
    "contracts/hello-world/**/*",
    # Vesting's legacy simulation suite is disabled pending a rewrite against
    # the current contract API; keep its untested code out of the aggregate
    # gate until that suite is restored.
    "contracts/vesting/**/*",
    "**/target_check/**/*",
    "**/examples/**/*",
    "**/fuzz/**/*"
]
