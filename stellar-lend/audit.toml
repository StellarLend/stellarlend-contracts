#
# body-parser: Body size limit is static and enforced by express defaults/edge limits; malformed compressed bodies are rejected before use.
#
# GHSA-27r3-jxmh-p828 | body-parser
# GHSA-v422-hmwv-36x6 | body-parser
#
# follow-redirects: Transitive through axios; auth headers are never sent to caller-selected cross-domain redirect targets.
#
# GHSA-r4q5-vmmm-2653 | follow-redirects
#
# form-data: Transitive through axios; neither service builds multipart bodies from unsanitized caller-controlled field names.
#
# GHSA-hmw2-7cc7-3qxx | form-data
#
# lodash: Transitive dependency only; no attacker-controlled template strings or array paths are passed to lodash.
#
# GHSA-f23m-r3pf-42rh | lodash
# GHSA-r5fr-rjxr-66jc | lodash
#
# path-to-regexp: Transitive through express; route patterns are static source constants, never derived from user input.
#
# GHSA-37ch-88jc-xwx2 | path-to-regexp
#
# proxy-addr: Trust proxy is not enabled, so proxy-derived IP values are not used for authorization or rate-limit identity.
#
# GHSA-jqcg-44mw-7w3h | proxy-addr
#
# qs: URL-encoded query parsing uses default comma-free formats with bounded pagination values; hostile toString objects cannot reach qs.stringify.
#
# GHSA-4mjr-xmp4-gh2g | qs
# GHSA-6pq8-jhm2-2vcw | qs
# GHSA-q8mj-m7cp-5q26 | qs
# GHSA-x5fp-wj9c-mxmx | qs
#
# toml: Transitive through @stellar/stellar-sdk; parsed TOML is trusted local configuration, not attacker input.
#
# GHSA-4qx8-w7c3-pj3p | toml
# GHSA-82x6-q7mm-w9cf | toml
# GHSA-9j65-hcg3-gc64 | toml
