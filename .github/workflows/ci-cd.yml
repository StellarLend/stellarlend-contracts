name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with stellar-lend/rust-toolchain.toml.
      - uses: dtolny/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-lend

      - name: Check workspace
        working-directory: stellar-lend
        run: cargo check --workspace --lib  --keep-going

      - name: Run vesting contract tests
        working-directory: stellar-lend
        run: cargo test -p stellarlend-vesting

      - name: Run multisig tests
        working-directory: stellar-lend
        run: cargo test -p stellarlend-multisig

      - name: Run WASM size checker unit tests
        run: bash scripts/tests/test_check_wasm_sizes.sh

      # Equivalent to `stellar contract build --package <pkg>` (which wraps this
      # exact cargo invocation) without the multi-minute Stellar CLI install.
      - name: Build release contract WASMs
        working-directory: stellar-lend
        run: |
          cargo build --release --target wasm32v1-none \
            -p stellarlend-lending \
            -p stellarlend-amm \
            -p stellarlend-vesting \
            -p stellarlend-multisig

      - name: Optimize WASMs
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          for f in stellar-lend/target/wasm32v1-none/release/stellarlend_*.wasm; do
            wasm-opt -Oz --strip-debug --strip-producers "$f" -o "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Enforce WASM size budgets
        run: bash scripts/check_wasm_sizes.sh

      - name: Generate SHA-256 checksums
        working-directory: stellar-lend/target/wasm32v1-none/release
        run: |
          sha256sum stellarlend_lending.wasm stellarlend_amm.wasm stellarlend_vesting.wasm stellarlend_multisig.wasm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-wasms
          path: |
            stellar-lend/target/wasm32v1-none/release/stellarlend_lending.wasm
            stellar-lend/target/wasm32v1-none/release/stellarlend_amm.wasm
            stellar-lend/target/wasm32v1-none/release/stellarlend_vesting.wasm
            stellar-lend/target/wasm32v1-none/release/stellarlend_multisig.wasm
            stellar-lend/target/wasm32v1-none/release/SHA256SUMS
          if-no-files-found: error

  # Soroban budget benchmarks for the lending contract's hot entrypoints.
  # Runs only the `tests/budget_bench.rs` integration test, compares each
  # metric against `${crate}/bench_baseline.json` and fails on a >10%
  # regression. The table is written to the job summary.
  budget-bench:
    name: Budget benchmarks (lending)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolny/rust-toolchain@master
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-lend

      - name: Run budget benchmarks
        working-directory: stellar-lend
        run: |
          set -o pipefail
          cargo test -p stellarlend-lending --test budget_bench -- --nocapture 2>&1 | tee budget_bench.log
          exit "${PIPESTATUS[0]}"

      - name: Publish budget table to job summary
        if: always()
        working-directory: stellar-lend
        run: |
          {
            echo '## Soroban budget benchmarks (lending)'
            echo ''
            echo '| Scenario | CPU |'
            echo '| --- | --- |'
            grep -E '^\[budget_bench\]' budget_bench.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload budget bench log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-bench-log
          path: stellar-lend/budget_bench.log
          if-no-files-found: warn

  fuzz-smoke:
    name: Fuzz smoke (lending)
    runs-on: ubuntu-latest
    # Runs only for PRs that touch the lending contract.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes under stellar-lend/contracts/lending
        id: changes
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^stellar-lend/contracts/lending/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: dtolny/rust-toolchain@nightly
      - if: steps.changes.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: stellar-lend/contracts/lending/fuzz
      - name: Install cargo-fuzz
        if: steps.changes.outputs.changed == 'true'
        run: cargo install cargo-fuzz --locked
      # None of the targets below need `edd25519-dalek` directly, but
      # `soroban-env-host` 25.0.1 depends on it with an unbounded `>=2.0.0`, so a
      # fresh resolve also selects 3.x, whose `SigningKey::generate` needs the
      # `rand_core` 0.10 traits that its testutils rng does not implement. Pull
      # the graph back to the version the committed workspace lock already uses.
      - name: Pin ed25519-dalek for the fuzz resolve
        if: steps.changes.outputs.changed == 'true'
        working-directory: stellar-lend/contracts/lending/fuzz
        run: |
          cargo +nightly generate-lockfile
          cargo +nightly update -p ed25519-dalek@3.0.0 --precise 2.2.0
      # A failed build is a real breakage, so this step stays blocking.
      - name: Build all fuzz targets
        if: steps.changes.outputs.changed == 'true'
        working-directory: stellar-lend/contracts/lending/fuzz
        run: cargo +nightly fuzz build
      # The time-boxed runs below are deliberately NON-BLOCKING at first: their
      # runtime is the only unstable part of this job, and a slow or flaky runner
      # must not block a merge. Drop `continue-on-error` once the runtimes settle.
      - name: Smoke run fuzz_entrypoints (60s)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        working-directory: stellar-lend/contracts/lending/fuzz
        run: cargo +nightly fuzz run fuzz_entrypoints -- -max_total_time=60
      - name: Smoke run fuzz_liquidate_close_factor (60s)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        working-directory: stellar-lend/contracts/lending/fuzz
        run: cargo +nightly fuzz run fuzz_liquidate_close_factor -- -max_total_time=60
      - name: Smoke run fuzz_borrow_rate (60s)
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        working-directory: stellar-lend/contracts/lending/fuzz
        run: cargo +nightly fuzz run fuzz_borrow_rate -- -max_total_time=60

      - name: Test bridge crate
        run: cargo test -p stellarlend-bridge

      - name: Build bridge WASM
        run: cargo build -p stellarlend-bridge --target wasm32v1-none --release