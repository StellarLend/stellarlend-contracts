name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

# Five-job pipeline that mirrors docs/CI_OVERVIEW.md:
#
#   check ──────────────► build-and-test ─► coverage
#   soroban-checks ─────►       │
#                              ▼
#   audit (parallel with the above)
#
# - `check`, `soroban-checks`, `audit`: run on ubuntu-latest in parallel.
# - `build-and-test`: runs on macos-latest, gated on check + soroban-checks.
# - `coverage`: runs on ubuntu-latest (cargo-tarpaulin is Linux-only, it uses
#   ptrace), gated on build-and-test so coverage runs only when the
#   workspace actually compiled and tests linked.
jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history avoids git index errors in cached steps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pin to 1.91.0 to honour stellar-lend/rust-toolchain.toml; using the
          # repo pin (rather than `stable`) prevents surprise upgrades when
          # GitHub-hosted runners rotate to a newer stable toolchain.
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          cd stellar-lend
          cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cd stellar-lend
          # --all-targets --all-features -- -D warnings matches docs/CI_OVERVIEW.md.
          # The -A flags below are retained for known false positives that have
          # historically been tolerated in this codebase; flip them back to -D
          # once the underlying warnings are cleaned up.
          cargo clippy --all-targets --all-features --workspace -- \
            -D warnings \
            -A deprecated \
            -A dead_code \
            -A unused-imports \
            -A unused-attributes \
            -A clippy::inconsistent-digit-grouping \
            -A clippy::manual-range-contains \
            -A clippy::unnecessary-cast

  soroban-checks:
    name: Soroban Validations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli
          stellar --version

      - name: Build contracts (wasm32)
        run: |
          cd stellar-lend
          stellar contract build --verbose

      - name: Optimize contracts
        run: |
          set -e
          shopt -s nullglob
          for wasm in stellar-lend/target/wasm32-unknown-unknown/release/*.wasm; do
            # Don't re-optimize artifacts that already end in -optimized.wasm.
            case "$wasm" in
              *-optimized.wasm) continue ;;
            esac
            stellar contract optimize --wasm "$wasm"
          done

      - name: Inspect compiled contracts
        run: |
          set -e
          shopt -s nullglob
          mkdir -p stellar-lend/target/wasm32-unknown-unknown/inspect
          for wasm in stellar-lend/target/wasm32-unknown-unknown/release/*-optimized.wasm; do
            out="stellar-lend/target/wasm32-unknown-unknown/inspect/$(basename "${wasm%.wasm}.json")"
            stellar contract inspect --wasm "$wasm" --output json > "$out"
            echo "inspected: $out"
          done

      - name: Upload Soroban build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm-builds
          path: |
            stellar-lend/target/wasm32-unknown-unknown/release/*.wasm
            stellar-lend/target/wasm32-unknown-unknown/inspect/

  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    needs: [check, soroban-checks]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build project
        run: |
          cd stellar-lend
          cargo build --verbose

      - name: Run unit tests
        run: |
          cd stellar-lend
          cargo test --lib --verbose

      - name: Run integration tests
        run: |
          cd stellar-lend
          cargo test --tests --verbose

      # `cargo doc` runs LAST on purpose: a doc-build failure here should not
      # mask a more important test failure earlier in the same job.
      - name: Build documentation
        run: |
          cd stellar-lend
          cargo doc --no-deps --verbose

      - name: Generate test report
        if: always()
        run: |
          cd stellar-lend || exit 0
          # Best-effort capture; do not fail the job if test report generation
          # fails because tests themselves were the failure.
          cargo test --lib --verbose -- --nocapture > lending_test_report.txt 2>&1 || true
          tail -n 200 lending_test_report.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: stellar-lend/lending_test_report.txt

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Install cargo-audit
        # Pin to the 0.21.x line that the runbook promises; --locked keeps the
        # install reproducible across runner images.
        run: cargo install cargo-audit --version '^0.21' --locked

      - name: Run security audit
        run: |
          cd stellar-lend
          cargo audit \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2025-0009 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0363 \
            --ignore RUSTSEC-2024-0344 \
            --ignore RUSTSEC-2022-0093

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            stellar-lend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --version 0.31.0

      - name: Generate code coverage
        run: |
          cd stellar-lend
          cargo tarpaulin --verbose --out Xml --workspace

      - name: Enforce per-crate coverage thresholds
        run: |
          python3 scripts/enforce_coverage.py \
            stellar-lend/cobertura.xml \
            --thresholds-json scripts/coverage_thresholds.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: stellar-lend/cobertura.xml
