name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least-privilege token: read-only by default; individual jobs add write
# scopes only where the step genuinely needs them (none currently do).
permissions:
  contents: read

# Cancel any in-progress run for the same PR branch on a new push.
# push-to-main runs are never cancelled (group is unique per SHA).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Keep in sync with stellar-lend/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain: 1.93.0
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: stellar-lend

      - name: Run coverage enforcement unit tests
        run: python3 scripts/tests/test_enforce_coverage.py

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate and enforce coverage
        working-directory: stellar-lend
        run: |
          cargo tarpaulin --config .tarpaulin.toml --out Xml
          python3 ../scripts/enforce_coverage.py

      - name: Upload Cobertura report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-report
          path: stellar-lend/cobertura.xml
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        continue-on-error: true
        uses: codecov/codecov-action@b9f035c79da2218cedb197a7b6b7bded2e9e36a8 # v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: stellar-lend/cobertura.xml
          fail_ci_if_error: false

  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Keep in sync with stellar-lend/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain: 1.93.0
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: stellar-lend

      - name: Check formatting
        working-directory: stellar-lend
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: stellar-lend
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -A deprecated \
            -A dead_code \
            -A unused-imports \
            -A unused-attributes \
            -A clippy::inconsistent-digit-grouping \
            -A clippy::manual-range-contains \
            -A clippy::unnecessary_cast

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      # Keep in sync with stellar-lend/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain: 1.93.0
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: stellar-lend

      - name: Check workspace
        working-directory: stellar-lend
        run: cargo check --workspace --lib --keep-going

      - name: Run workspace tests (excluding bridge)
        working-directory: stellar-lend
        run: cargo test --workspace --exclude stellarlend-bridge --locked

      - name: Test bridge crate
        working-directory: stellar-lend
        run: cargo test -p stellarlend-bridge

      - name: Build bridge WASM
        working-directory: stellar-lend
        run: cargo build -p stellarlend-bridge --target wasm32v1-none --release

      - name: Run AMM tests
        timeout-minutes: 15
        working-directory: stellar-lend
        run: cargo test -p stellarlend-amm

      - name: Run WASM size checker unit tests
        run: bash scripts/tests/test_check_wasm_sizes.sh

      - name: Check test snapshots for drift
        working-directory: stellar-lend
        run: SNAPSHOT_CHECK=1 bash scripts/check-snapshots.sh

      # Equivalent to `stellar contract build --package <pkg>` (which wraps this
      # exact cargo invocation) without the multi-minute Stellar CLI install.
      - name: Build release contract WASMs
        working-directory: stellar-lend
        run: |
          cargo build --release --target wasm32v1-none \
            -p stellarlend-lending \
            -p stellarlend-amm \
            -p stellarlend-vesting \
            -p stellarlend-multisig

      - name: Optimize WASMs
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          for f in stellar-lend/target/wasm32v1-none/release/stellarlend_*.wasm; do
            wasm-opt -Oz --strip-debug --strip-producers "$f" -o "$f.tmp" && mv "$f.tmp" "$f"
          done

      - name: Enforce WASM size budgets
        run: bash scripts/check_wasm_sizes.sh

      - name: Generate SHA-256 checksums
        working-directory: stellar-lend/target/wasm32v1-none/release
        run: |
          sha256sum stellarlend_lending.wasm stellarlend_amm.wasm stellarlend_vesting.wasm stellarlend_multisig.wasm > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wasms
          path: |
            stellar-lend/target/wasm32v1-none/release/stellarlend_lending.wasm
            stellar-lend/target/wasm32v1-none/release/stellarlend_amm.wasm
            stellar-lend/target/wasm32v1-none/release/stellarlend_vesting.wasm
            stellar-lend/target/wasm32v1-none/release/stellarlend_multisig.wasm
            stellar-lend/target/wasm32v1-none/release/SHA256SUMS
          if-no-files-found: error

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Runs only for PRs that touch the lending contract.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_entrypoints
          - fuzz_liquidate_close_factor
          - fuzz_borrow_rate
          - fuzz_accrual
          - fuzz_health_factor
          - fuzz_liquidation
          - fuzz_repay_borrow_roundtrip
          - fuzz_supply_rate
          - fuzz_utilization
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - name: Detect changes under stellar-lend/contracts/lending
        id: changes
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^stellar-lend/contracts/lending/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
      - if: steps.changes.outputs.changed == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: stellar-lend/contracts/lending/fuzz
      - name: Restore fuzz corpus cache
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: stellar-lend/contracts/lending/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Install cargo-fuzz
        if: steps.changes.outputs.changed == 'true'
        run: cargo install cargo-fuzz --locked
      # None of the targets below need `ed25519-dalek` directly, but
      # `soroban-env-host` 25.0.1 depends on it with an unbounded `>=2.0.0`, so a
      # fresh resolve also selects 3.x, whose `SigningKey::generate` needs the
      # `rand_core` 0.10 traits that its testutils rng does not implement. Pull
      # the graph back to the version the committed workspace lock already uses.
      - name: Pin ed25519-dalek for the fuzz resolve
        if: steps.changes.outputs.changed == 'true'
        working-directory: stellar-lend/contracts/lending/fuzz
        run: |
          cargo +nightly generate-lockfile
          cargo +nightly update -p ed25519-dalek@3.0.0 --precise 2.2.0
      - name: Build all fuzz targets
        if: steps.changes.outputs.changed == 'true'
        working-directory: stellar-lend/contracts/lending/fuzz
        run: cargo +nightly fuzz build
      - name: Smoke run ${{ matrix.target }} (60s)
        if: steps.changes.outputs.changed == 'true'
        working-directory: stellar-lend/contracts/lending/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
      - name: Upload crash artifacts
        if: failure() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ github.run_id }}
          path: stellar-lend/contracts/lending/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore

  bridge-checks:
    name: Bridge crate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # toolchain: 1.93.0
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

  api-service:
    name: API Service (lint, tsc, jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Detect changes under api/
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^api/'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: api
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        working-directory: api
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        working-directory: api
        run: npm run build

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        working-directory: api
        run: npm test

      - name: Upload API coverage
        if: steps.changes.outputs.changed == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-coverage
          path: api/coverage

  oracle-service:
    name: Oracle Service (tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes under oracle/
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^oracle/'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: oracle/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: oracle
        run: npm ci

      # Lint (`npm run lint`) is skipped until an ESLint config is added under oracle/.

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        working-directory: oracle
        run: npm run build

      - name: Test with coverage
        if: steps.changes.outputs.changed == 'true'
        working-directory: oracle
        run: npm run test:coverage

      - name: Upload Oracle coverage
        if: steps.changes.outputs.changed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-coverage
          path: oracle/coverage
          if-no-files-found: ignore
